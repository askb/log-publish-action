---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Python test suite ###
  # Runs entirely offline: uploads go to recording fakes or to real
  # boto3 clients whose requests are intercepted before they are sent.
  # Covers every supported Python. 3.10 reached end of life in October
  # 2026 and is no longer supported; the floor action.yaml enforces
  # matches the oldest interpreter here.
  python-tests:
    name: "Python test suite (${{ matrix.python }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.4"
          python-version: "${{ matrix.python }}"

      - name: "Check the lock and the runtime requirements"
        shell: bash
        run: |
          # Check the lock and the runtime requirements
          # uv.lock pins the dev tools and must match pyproject.toml.
          uv lock --check
          # The action installs requirements.txt with --no-deps, so pip
          # never checks that the pins agree. Install it here with
          # dependency resolution on, using the runner's python3 as the
          # action does: every dependency must already be pinned and
          # hashed, and pip check must find no conflict. This catches a
          # boto3 bump that needs a newer botocore.
          python3 -m venv /tmp/requirements-check
          /tmp/requirements-check/bin/python -m pip install \
            --quiet --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r requirements.txt
          /tmp/requirements-check/bin/python -m pip check

      - name: "Run test suite"
        shell: bash
        env:
          PYTHON_VERSION: "${{ matrix.python }}"
        run: |
          # Run test suite
          # The tests run against exactly what the action installs: the
          # dev tools from uv.lock, then requirements.txt on top.
          uv sync --frozen
          uv pip install --require-hashes --no-deps --only-binary=:all: \
            -r requirements.txt
          uv run --frozen ruff check
          uv run --frozen pytest -v | tee /tmp/test-output.txt
          {
            echo "### Python $PYTHON_VERSION test suite"
            echo '```text'
            tail -3 /tmp/test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Perform setup prior to running test(s)
      - name: "Testing setup step"
        shell: bash
        run: |
          # Build a workspace resembling a real Maven/Karaf build
          mkdir -p archives/robot-plugin
          mkdir -p target/SFT
          mkdir -p target/surefire-reports
          echo "karaf started" > target/SFT/karaf.log
          echo "<testsuite/>" > target/surefire-reports/TEST-a.xml
          echo "<html><body>report</body></html>" \
            > archives/robot-plugin/report.html
          echo "build summary" > archives/summary.txt
          echo "Testing setup complete 💬" >> "$GITHUB_STEP_SUMMARY"

      - name: "Running local action: ${{ github.repository }}"
        id: publish
        uses: $/
        with:
          s3_bucket: "logs-example-org"
          namespace: "gha-test"
          base_url: "https://logs.example.org"
          archive_patterns: |
            target/SFT/**
            target/surefire-reports/*.xml
          dry_run: true

      - name: "Validated local action: ${{ github.repository }}"
        shell: bash
        env:
          S3_PATH: "${{ steps.publish.outputs.s3_path }}"
          LOG_URL: "${{ steps.publish.outputs.log_url }}"
          FILE_COUNT: "${{ steps.publish.outputs.file_count }}"
          REPO: "${{ github.repository }}"
        run: |
          # Local action validation
          set -euo pipefail
          fail=0

          if [ -z "$S3_PATH" ]; then
            echo "Error: s3_path output is empty ❌"
            fail=1
          fi
          if [ -z "$LOG_URL" ]; then
            echo "Error: log_url output is empty ❌"
            fail=1
          fi
          # archives/* plus both glob patterns plus generated metadata
          if [ "${FILE_COUNT:-0}" -lt 4 ]; then
            echo "Error: expected at least 4 files, got '$FILE_COUNT' ❌"
            fail=1
          fi
          case "$S3_PATH" in
            logs/gha-test/*) ;;
            *)
              echo "Error: unexpected s3_path '$S3_PATH' ❌"
              fail=1
              ;;
          esac

          [ "$fail" -eq 0 ] || exit 1
          echo "Validated local action: $REPO ✅"
          {
            echo "### Action outputs"
            echo "- s3_path: \`$S3_PATH\`"
            echo "- log_url: $LOG_URL"
            echo "- file_count: $FILE_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact destination is the fallback if the S3 log server is
      # ever retired, so it must work with no bucket and no credentials.
      # This is also the only path that cannot be covered offline, since
      # it really invokes actions/upload-artifact.
      - name: "Running local action: artifact destination"
        id: artifact
        uses: $/
        with:
          destination: "artifact"
          artifact_name: "test-build-logs"
          artifact_retention_days: "1"
          archive_patterns: |
            target/SFT/**
            target/surefire-reports/*.xml

      - name: "Verify artifact destination behaviour"
        shell: bash
        env:
          FILE_COUNT: "${{ steps.artifact.outputs.file_count }}"
          ARTIFACT_NAME: "${{ steps.artifact.outputs.artifact_name }}"
          STAGING_DIR: "${{ steps.artifact.outputs.staging_dir }}"
          LOG_URL: "${{ steps.artifact.outputs.log_url }}"
        run: |
          # Verify artifact destination behaviour
          set -euo pipefail
          if [ "${FILE_COUNT:-0}" -lt 1 ]; then
            echo "Error: artifact run collected no files ❌"
            exit 1
          fi
          if [ "$ARTIFACT_NAME" != 'test-build-logs' ]; then
            echo "Error: artifact_name was '$ARTIFACT_NAME' ❌"
            exit 1
          fi
          # Nothing went to S3, so there can be no log URL.
          if [ -n "$LOG_URL" ]; then
            echo "Error: artifact run produced an S3 URL '$LOG_URL' ❌"
            exit 1
          fi
          # The cleanup step owns the staged tree once upload completes.
          if [ -e "$STAGING_DIR" ]; then
            echo "Error: staged tree survived at '$STAGING_DIR' ❌"
            exit 1
          fi
          echo "Artifact destination verified: ${FILE_COUNT} file(s) ✅"

      # Publishing must never mask the result of the build that produced
      # the logs, so an unreachable bucket is tolerated by default. A dry
      # run makes no S3 calls and so can never fail, so these legs really
      # attempt the upload. The action installs the pinned boto3, and the
      # runner holds no AWS credentials, so every attempt fails while
      # signing, before a request leaves the process; no bucket is
      # touched. A broken install or client would produce the same
      # counts from the outside, so this leg drives the publish step
      # directly and reads its log: the install must run, the client
      # must be created, and the failure must be the credential one.
      - name: "Publish step fails at signing, not before"
        shell: bash
        env:
          # Without credentials boto3 would otherwise probe the instance
          # metadata endpoint, which only adds a timeout per attempt.
          AWS_EC2_METADATA_DISABLED: "true"
          INPUT_S3_BUCKET: "logs-example-org"
          INPUT_NAMESPACE: "gha-test"
          INPUT_ARCHIVE_PATTERNS: "target/SFT/**"
          INPUT_INCLUDE_SYSINFO: "false"
          INPUT_PERMIT_FAIL: "true"
        run: |
          # Publish step fails at signing, not before
          set -euo pipefail
          python3 -E -s src/main.py publish | tee /tmp/publish.log
          fail=0
          if ! grep -q 'Installing boto3 (hash pinned)' /tmp/publish.log; then
            echo "Error: the run time boto3 install did not run ❌"
            fail=1
          fi
          if grep -q 'cannot create a client' /tmp/publish.log; then
            echo "Error: boto3 install or client creation failed ❌"
            fail=1
          fi
          if ! grep -q 'NoCredentialsError' /tmp/publish.log; then
            echo "Error: uploads did not fail on missing credentials ❌"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Uploads reached signing and failed there ✅"

      # The same run through the composite action: permit_fail must turn
      # that failure into a successful step.
      - name: "Running local action: permit_fail tolerates upload errors"
        id: tolerated
        uses: $/
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          s3_bucket: "logs-example-org"
          namespace: "gha-test"
          archive_patterns: "target/SFT/**"
          include_sysinfo: false
          permit_fail: true

      - name: "Verify permit_fail tolerated the failure"
        shell: bash
        env:
          OUTCOME: "${{ steps.tolerated.outcome }}"
          FILE_COUNT: "${{ steps.tolerated.outputs.file_count }}"
          UPLOAD_COUNT: "${{ steps.tolerated.outputs.upload_count }}"
          FAILED_COUNT: "${{ steps.tolerated.outputs.failed_count }}"
        run: |
          # Verify permit_fail tolerated the failure
          set -euo pipefail
          if [ "$OUTCOME" != 'success' ]; then
            echo "Error: permit_fail did not tolerate the failure ❌"
            exit 1
          fi
          # Every collected file must have been attempted and failed;
          # anything else means the leg did not test what it claims.
          if [ "${FAILED_COUNT:-0}" -lt 1 ] \
            || [ "$FAILED_COUNT" != "$FILE_COUNT" ] \
            || [ "${UPLOAD_COUNT:-1}" != '0' ]; then
            echo "Error: expected every upload to fail, got" \
              "$FAILED_COUNT of $FILE_COUNT failed," \
              "$UPLOAD_COUNT uploaded ❌"
            exit 1
          fi
          echo "permit_fail tolerated $FAILED_COUNT failed upload(s) ✅"

      # The same failure with permit_fail off must fail the step, which
      # proves the flag, and not a silent success, decided the leg above.
      - name: "Running local action: permit_fail off surfaces upload errors"
        id: strict
        uses: $/
        continue-on-error: true
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          s3_bucket: "logs-example-org"
          namespace: "gha-test"
          archive_patterns: "target/SFT/**"
          include_sysinfo: false
          permit_fail: false

      - name: "Error if strict step did NOT fail"
        if: steps.strict.outcome != 'failure'
        shell: bash
        run: |
          # Error if strict step did NOT fail
          echo "Error: permit_fail false did not fail the step ❌"
          exit 1

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Override Failure]"
        uses: $/
        id: failure
        continue-on-error: true
        with:
          s3_bucket: "Invalid_Bucket_Name!"
          dry_run: true

      # Failure testing is also important
      - name: "Error if step above did NOT fail"
        if: steps.failure.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1
