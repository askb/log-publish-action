# SPDX-FileCopyrightText: 2026 The Linux Foundation

# log-publish-action
name: '🪵 Publish Build Logs'

description: >-
  Publishes build logs and test reports to an S3 log server, to GitHub
  workflow artifacts, or to both
# Replicates the Jenkins/JJB post-build log shipping behaviour
# (global-jjb lf-infra-publish -> logs-deploy.sh -> lftools deploy s3)
# for GitHub Actions, writing to the same bucket layout so the existing
# server side directory index generation keeps working unchanged.
#
# Collection, console capture, metadata generation and compression are
# independent of where the result lands, so the same pipeline feeds the
# artifact destination. That keeps the action usable unchanged if the S3
# log server is ever retired.

inputs:
  # Destination
  destination:
    description: >-
      Where to publish: s3, artifact, or both. S3 gives anonymously
      readable URLs and server rendered HTML reports. Artifacts are free
      but require a GitHub login to download, even on public repos, and
      arrive as a single zip. Drive this from an organisation variable so
      a fleet wide move needs one change rather than one per repository.
    required: false
    default: 's3'

  # Mandatory for the s3 and both destinations
  s3_bucket:
    description: >-
      Target S3 bucket name. Required unless destination is artifact.
    required: false
    default: ''

  # Path construction
  s3_path:
    description: >-
      Full path within the bucket. Overrides the derived path. Must be at
      least three segments deep, since the first three receive the index
      marker that refreshes directory listings.
    required: false
    default: ''
  path_prefix:
    description: 'Top level prefix within the bucket'
    required: false
    default: 'logs'
  namespace:
    description: >-
      Second path element, analogous to the Jenkins silo. Keeps GitHub
      Actions output separate from the Jenkins hierarchy.
    required: false
    default: 'gha'
  job_name:
    description: >-
      Job identifier used in the path. Defaults to the GitHub job id.
      Set this to a matrix unique value; without it, parallel matrix legs
      overwrite each other.
    required: false
    default: ''

  # Content selection
  workspace:
    description: 'Directory to collect files from'
    required: false
    default: ''
  archive_dir:
    description: >-
      Directory below the workspace whose contents are always collected,
      matching the Jenkins $WORKSPACE/archives convention.
    required: false
    default: 'archives'
  archive_patterns:
    description: >-
      Newline separated glob patterns, relative to the workspace, naming
      additional files to collect. Equivalent to ARCHIVE_ARTIFACTS in JJB.
    required: false
    default: ''
  capture_console:
    description: >-
      Fetch the console log of every job in this workflow run through the
      GitHub REST API. Requires github_token and actions:read permission.
      A job cannot read its own log while running, so enable this only in
      a dedicated final job.
    required: false
    default: 'false'
  include_sysinfo:
    description: 'Write a _sys-info.log describing the runner'
    required: false
    default: 'true'

  # Upload behaviour
  compress:
    description: 'Compress text content before upload'
    required: false
    default: 'true'
  compress_suffix:
    description: >-
      Append a .gz extension to compressed files, reproducing the legacy
      Jenkins naming. Off by default because renaming breaks relative
      links inside multi file reports such as Allure or Robot Framework.
    required: false
    default: 'false'
  index_markers:
    description: >-
      Upload and then remove a marker object in each of the first three
      path segments, triggering server side regeneration of index.html.
    required: false
    default: 'true'
  base_url:
    description: 'Public base URL of the log server, used to build log_url'
    required: false
    default: ''
  aws_region:
    description: 'AWS region of the bucket'
    required: false
    default: 'us-east-1'

  # Artifact destination
  artifact_name:
    description: >-
      Name of the uploaded workflow artifact. Must be unique within the
      run, so set this per matrix leg when a matrix publishes logs.
    required: false
    default: 'build-logs'
  artifact_retention_days:
    description: >-
      Retention in days. Empty uses the repository default. Public repos
      allow 1 to 90; the S3 lifecycle currently keeps objects for 180.
    required: false
    default: ''
  artifact_if_no_files_found:
    description: 'Behaviour when nothing was collected: warn, error, ignore'
    required: false
    default: 'warn'

  github_token:
    description: 'Token used when capture_console is enabled'
    required: false
    default: ''
  dry_run:
    description: >-
      Collect, compress and build the manifest, but perform no S3 calls.
      Used by the test suite and for local verification.
    required: false
    default: 'false'
  permit_fail:
    description: >-
      Do not fail the step when publishing fails. Defaults true because
      losing logs should not mask the result of the build that produced
      them.
    required: false
    default: 'true'

outputs:
  s3_path:
    description: 'Resolved path within the bucket'
    value: "${{ steps.publish.outputs.s3_path }}"
  log_url:
    description: 'Public URL of the published directory'
    value: "${{ steps.publish.outputs.log_url }}"
  file_count:
    description: 'Number of files collected'
    value: "${{ steps.publish.outputs.file_count }}"
  upload_count:
    description: 'Number of files uploaded successfully'
    value: "${{ steps.publish.outputs.upload_count }}"
  failed_count:
    description: 'Number of files that failed to upload'
    value: "${{ steps.publish.outputs.failed_count }}"
  manifest_path:
    description: 'Path to the generated upload manifest'
    value: "${{ steps.publish.outputs.manifest_path }}"
  staging_dir:
    description: >-
      Directory holding the staged tree. Populated when the artifact
      destination is in use, or after a dry run, and empty otherwise.
    value: "${{ steps.publish.outputs.staging_dir }}"
  artifact_name:
    description: 'Name of the uploaded artifact, empty when none was uploaded'
    value: "${{ steps.publish.outputs.artifact_name }}"

runs:
  using: 'composite'
  steps:
    - name: 'Validate inputs'
      id: validate
      shell: bash
      env:
        INPUT_DESTINATION: "${{ inputs.destination }}"
        INPUT_S3_BUCKET: "${{ inputs.s3_bucket }}"
        INPUT_S3_PATH: "${{ inputs.s3_path }}"
        INPUT_PATH_PREFIX: "${{ inputs.path_prefix }}"
        INPUT_NAMESPACE: "${{ inputs.namespace }}"
        INPUT_CAPTURE_CONSOLE: "${{ inputs.capture_console }}"
        INPUT_GITHUB_TOKEN: "${{ inputs.github_token }}"
        INPUT_DRY_RUN: "${{ inputs.dry_run }}"
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/validate.sh"

    - name: 'Collect and publish logs'
      id: publish
      shell: bash
      env:
        INPUT_DESTINATION: "${{ inputs.destination }}"
        INPUT_S3_BUCKET: "${{ inputs.s3_bucket }}"
        INPUT_S3_PATH: "${{ inputs.s3_path }}"
        INPUT_PATH_PREFIX: "${{ inputs.path_prefix }}"
        INPUT_NAMESPACE: "${{ inputs.namespace }}"
        INPUT_JOB_NAME: "${{ inputs.job_name }}"
        INPUT_WORKSPACE: "${{ inputs.workspace }}"
        INPUT_ARCHIVE_DIR: "${{ inputs.archive_dir }}"
        INPUT_ARCHIVE_PATTERNS: "${{ inputs.archive_patterns }}"
        INPUT_CAPTURE_CONSOLE: "${{ inputs.capture_console }}"
        INPUT_INCLUDE_SYSINFO: "${{ inputs.include_sysinfo }}"
        INPUT_COMPRESS: "${{ inputs.compress }}"
        INPUT_COMPRESS_SUFFIX: "${{ inputs.compress_suffix }}"
        INPUT_INDEX_MARKERS: "${{ inputs.index_markers }}"
        INPUT_BASE_URL: "${{ inputs.base_url }}"
        INPUT_AWS_REGION: "${{ inputs.aws_region }}"
        INPUT_ARTIFACT_NAME: "${{ inputs.artifact_name }}"
        INPUT_GITHUB_TOKEN: "${{ inputs.github_token }}"
        INPUT_DRY_RUN: "${{ inputs.dry_run }}"
        INPUT_PERMIT_FAIL: "${{ inputs.permit_fail }}"
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/publish-logs.sh"

    # Runs whenever the staged tree survived, which the script arranges
    # for the artifact and both destinations. Guarded on the path rather
    # than the destination alone so a collection failure cannot turn into
    # a confusing upload-artifact error.
    - name: 'Upload logs as workflow artifact'
      if: >-
        ${{ (inputs.destination == 'artifact' || inputs.destination == 'both')
        && inputs.dry_run != 'true'
        && steps.publish.outputs.staging_dir != '' }}
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: "${{ inputs.artifact_name }}"
        path: "${{ steps.publish.outputs.staging_dir }}"
        retention-days: "${{ inputs.artifact_retention_days }}"
        if-no-files-found: "${{ inputs.artifact_if_no_files_found }}"

    # The script hands ownership of the staged tree to the step above, so
    # it cannot clean up after itself. Always, so a failed upload still
    # leaves no temporary data on a self hosted runner.
    - name: 'Remove staged tree'
      if: >-
        ${{ always() && inputs.dry_run != 'true'
        && steps.publish.outputs.staging_dir != '' }}
      shell: bash
      env:
        STAGING_DIR: "${{ steps.publish.outputs.staging_dir }}"
      run: |
        rm -rf "$STAGING_DIR" 2> /dev/null || true
